name: Buraimi Space narration
on:
  workflow_dispatch:
  push:
    paths:
      - 'projects/buraimi-space/cues.json'
      - 'projects/buraimi-space/voice.py'
      - '.github/workflows/buraimi-space-voice.yml'
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - run: python projects/buraimi-space/voice.py /tmp/space-voice
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buraimi-space-voice
          path: |
            /tmp/space-voice/voice.wav
            /tmp/space-voice/timing.json
      - name: Keep the narration next to the film
        run: |
          mkdir -p projects/buraimi-space/assets
          ffmpeg -v error -y -i /tmp/space-voice/voice.wav -c:a libmp3lame -b:a 192k projects/buraimi-space/assets/voice.mp3
          cp /tmp/space-voice/timing.json projects/buraimi-space/assets/voice-timing.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/buraimi-space/assets/voice.mp3 projects/buraimi-space/assets/voice-timing.json
          git diff --cached --quiet || git commit -m "Update synthesized narration track"
          git push origin HEAD:${{ github.ref_name }}
