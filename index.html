<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2D Motion Studio | معاينة</title><style>body{background:#102b35;color:#f8f2e6;font:16px system-ui;margin:0;padding:24px}main{max-width:1000px;margin:auto}#stage{aspect-ratio:16/9;width:100%;overflow:hidden;border-radius:16px;background:#173c48}#stage svg{width:100%;height:100%;display:block}button,input{font:inherit}button{padding:10px 18px;border:0;border-radius:10px;background:#49b8a5;color:#102b35;font-weight:700}input{width:100%;accent-color:#49b8a5}p{color:#c3ded8}button:focus-visible,input:focus-visible{outline:3px solid #e6bd77}</style></head><body><main><h1>استوديو الموشن 2D</h1><p>معاينة فيديو السلامة الرقمية • 15 ثانية • 1080p</p><div id="stage"></div><p><button id="play">إيقاف مؤقت</button> <output id="time">0.0 / 15</output></p><label for="seek">الخط الزمني</label><input id="seek" type="range" min="0" max="449" value="0" dir="ltr"></main><script type="module">import{sceneSVG,FRAMES,FPS}from './src/scene.mjs';let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,start=performance.now();const stage=document.querySelector('#stage'),seek=document.querySelector('#seek'),btn=document.querySelector('#play'),time=document.querySelector('#time');function draw(){stage.innerHTML=sceneSVG(frame);seek.value=frame;time.value=`${(frame/FPS).toFixed(1)} / 15`;btn.textContent=playing?'إيقاف مؤقت':'تشغيل'}btn.onclick=()=>{playing=!playing;start=performance.now()-frame/FPS*1000;draw()};seek.oninput=()=>{frame=+seek.value;start=performance.now()-frame/FPS*1000;draw()};function loop(now){if(playing){const next=Math.floor((now-start)*FPS/1000)%FRAMES;if(next!==frame){frame=next;draw()}}requestAnimationFrame(loop)}draw();requestAnimationFrame(loop);</script></body></html>
